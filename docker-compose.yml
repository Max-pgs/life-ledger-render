services:
  db:
    image: postgres:17
    container_name: lifeledger_db
    restart: unless-stopped

    environment:
      POSTGRES_DB: lifeledger
      POSTGRES_USER: lifeledger
      POSTGRES_PASSWORD: lifeledger_dev_password

    ports:
    - "5433:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data
  
  backend:
    build: 
      context: ./backend
    container_name: lifeledger_backend
    restart: unless-stopped
    command: python manage.py runserver 0.0.0.0:8000
    volumes:
      - ./backend:/app
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      POSTGRES_DB: lifeledger
      POSTGRES_USER: lifeledger
      POSTGRES_PASSWORD: lifeledger_dev_password
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
    depends_on:
      - db

volumes:
  postgres_data: